server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these filenames by content hash, so a given path is
    # immutable — safe to cache forever, new deploys just ship new paths.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is not fingerprinted and references the current hashed
    # asset paths, so it must never be served stale out of a cache — every
    # request revalidates against the server, picking up the latest deploy.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
